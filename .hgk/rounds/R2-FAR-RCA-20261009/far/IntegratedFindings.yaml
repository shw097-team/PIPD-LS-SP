challenge_adjustments:
  - id: C1
    target: deviation_q1
    adjustment: >
      Change "no independent VERIFY enforcement exists" to "rules and a candidate guard EXIST but are
      NOT mandatorily wired into the independent-lane dispatch on this path". It is NOT that enforcement
      is absent.
    evidence:
      - {citation: "HG-KSEOS/AGENTS.md:12,106-111", finding: "Completion requires an independent checker; maker/writer/orchestrator must not final self-accept; AO must be fresh-session VERIFY_ONLY. This is an existing process obligation, not an auto dispatch."}
      - {citation: "HG-KSEOS/src/hg_kseos/spine.py:324-345; HG-KSEOS/src/hg_kseos/lifecycle.py:58-59,163-182", finding: "record_workorder_result refuses writer==checker and DELIVERED refuses open WorkOrders, but the checker is a caller STRING with no model identity; EXECUTING may also go straight to EVOLUTION_REVIEW. So there is a closure guard, not an auto-spawned independent model lane."}
      - {citation: "HG-KSEOS/scripts/hgk-lane-guard.py:113-141; HG-KSEOS/evidence/review/FAR_LANE_SOD_004_ADOPTION_EVIDENCE_2026-10-07.md:40-53,86-93", finding: "The SoD guard exists and can refuse a same-model dispatch; the historical adoption record explicitly notes dispatcher/delegation guard integration was NOT applied. 'Exists but not wired' must not be stated as 'absent'.", observed: "REFUSE; exit_code=2; ERR_LANE_SOD_VIOLATION"}
      - {citation: "R/logs/agent.log:11270,11333; HG-KSEOS/var/far-lane-verify-002/lanes/lane_a_routing_facts.json:103-125", finding: "R13/R14 evidence ties terminal self-verification to session 20261007_004622_88f655; API #138/#139 were both deepseek-v4.1-flash/opencode-go. Supports main-loop model collapse, but these two records alone do not prove the whole session never dispatched any checker."}
    verdict: {confidence: medium, status: INCOMPLETE}
    confounds:
      - {citation: "HG-KSEOS/evidence/review/FAR_LANE_SOD_005_RESEARCH_EVIDENCE_2026-10-07.md:44-62", finding: "Cases exist where a lane was dispatched but hit user_stop, long search, guard retries, and its verdict never landed; 'no verdict' != 'lane never fired'."}
      - {citation: "HG-KSEOS/scripts/hgk-lane-guard.py:92-109; HG-KSEOS/config/lane-routing-registry.yaml:34,46", finding: "This run's guard reported registry_epoch=13, live_epoch=15, epoch_current=false. Even if wired, it could still refuse on a version-count mismatch; ADMIT was not reached with a legitimate admission."}
      - {citation: "HG-KSEOS/scripts/probe-hgk-lane.py:125-145,170-177", finding: "The live probe explicitly does not implement genuine dispatch, and the CLI writes a receipt even in dry-run."}
  - id: C2
    target: deviation_q2
    adjustment: >
      Split the single "PLAN" claim into three layers: (1) skeleton generation (lifecycle.plan ->
      _derive_tasks, HIGH confidence, no model), (2) plan AUTHORSHIP (which model wrote the intent /
      design / admission content), and (3) admission SUBMISSION (typed API persistence). The claim that
      this specific admission was deepseek-authored is LOW confidence: the target admission identity and
      the author lineage were not obtained. "GPT only does delegate/FAR" is REFUTED in the strong form,
      because a GPT-authored substantive plan artifact exists.
    evidence:
      - {citation: "HG-KSEOS/src/hg_kseos/lifecycle.py:259-296", finding: "plan() reads intent, calls _derive_tasks, assembles a TaskSpec skeleton and sets PLAN_READY; no GPT or other LLM invocation. This proves skeleton generation only, not the author of the upstream intent/design or the admission document."}
      - {citation: "HG-KSEOS/config/lane-routing-registry.yaml:52-70; HG-KSEOS/src/hg_kseos/spine.py:296-321", finding: "PLAN is declared openai-codex/gpt-6.1-sol; create_workorder only checks writer, base_head and TaskSpec state - there is no planner-model attestation. So a GPT routing obligation exists, but this API does not enforce GPT authorship."}
    counterexample_or_none:
      citation: "HG-KSEOS/evidence/review/FAR_LANE_SOD_004_ADOPTION_EVIDENCE_2026-10-07.md:13-17; HG-KSEOS/var/far-lane-sod-004/lanes/laneP_adoption_design.json:5,34-41"
      finding: >
        deleg_b78efec7 is recorded as a gpt-6.1-sol PLAN lane that produced a preimage-backed adoption
        design with concrete candidate diffs/proof commands. GPT-authored substantive planning therefore
        HAS a documentary counterexample - still a subagent plan, so it does not imply the lifecycle
        skeleton or the admission body was GPT-authored. Model-weight identity was not independently
        attested.
    verdict: {confidence: medium, status: PARTIALLY_SUPPORTED}
    confounds:
      - {citation: "HG-KSEOS/config/model-lane-assignment.json:120; R/hermes-agent/hermes_cli/kanban_db_dispatch.py:2694-2703; R/hermes-agent/tools/delegate_tool_config.py:482-507", finding: "Kanban card pins and delegate_task routing are different surfaces; a card bearing a GPT pin does not prove delegate or the main loop consumed it."}
      - {citation: "HG-KSEOS/scripts/start-hgk-hermes.ps1:255-281,347-350", finding: "The sealed EXECUTE front door limits the single sanctioned model; the transported_model receipt is explicitly NOT proof of the backend weights."}
    what_would_refute:
      - "A specific failed round's full transcript/runtime log showing an independent VERIFY was spawned and completed."
      - "An EXECUTE-complete -> independent-VERIFY spawn hook that is un-bypassable on the round's actual call chain."
      - "Source/call trace of lifecycle.plan actually invoking GPT (not found), or a target admission payload traceable to a GPT plan artifact with full author lineage (not obtained)."
      - "Evidence that GPT never did substantive planning (already refuted by the adoption-design counterexample)."

