summary: >
  Two model-SoD deviations are confirmed. Q1: the round ran an EXECUTE leg but never started an
  independent VERIFY / Acceptance-Officer lane, so no 8-pack acceptance ran. The confirmed root cause
  is that no dispatch surface in the checked chain carries an obligatory EXECUTE-complete ->
  independent-VERIFY handoff: the sealed Write launcher consumes its binding, runs codex.exe, prints a
  write receipt and exits 0 (start-hgk-hermes.ps1:328-361); the lifecycle permits EXECUTING ->
  EVOLUTION_REVIEW without passing through VERIFYING (lifecycle.py:58); Kanban completion only promotes
  already-existing children (kanban_db.py:2819-2827). Q2: the GPT-only PLANNING intent was present only
  at the delegate/FAR subagent layer; lifecycle.plan() and the admission API make no model call and do
  not enforce a GPT author, so the deepseek main loop remained the author of the admission. Both
  deviations break the owner's PLAN->EXECUTE->VERIFY model-SoD and the "every governed round closes
  with independent acceptance" rule. LANE_C corrects the framing of both: it is NOT "no enforcement
  exists" (rules, a writer!=checker guard, a delivery gate and a runnable pre-dispatch guard DO exist)
  and it is NOT a single "PLAN" fault (skeleton generation, plan authorship, and admission submission
  are three layers). LANE_D supplies a minimal-resistance uplift that adds a fail-closed VERIFY handoff
  at the sealed Write boundary without a second scheduler, DB, or control plane.

