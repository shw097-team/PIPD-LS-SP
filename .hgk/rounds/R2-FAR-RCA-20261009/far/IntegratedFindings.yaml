# Deviation 1 — Q1: EXECUTE ran, no independent VERIFY / AO lane (no 8-pack)
# ---------------------------------------------------------------------------
deviation_q1:
  statement: >
    Why did the round run an EXECUTE leg but never start an independent VERIFY / Acceptance-Officer
    lane (only a one-line GLM tool smoke), so that no 8-pack acceptance ever ran?
  root_cause: >
    The checked dispatch chain has no obligatory EXECUTE-complete -> independent-VERIFY handoff. Model
    policy is a SUPPLY CHOICE, not a mandatory workflow edge: the sealed Write branch produces its
    receipt and exits without spawning a checker; the lifecycle allows EXECUTING -> EVOLUTION_REVIEW
    (VERIFYING is skippable); Kanban completion promotes only pre-existing children. Therefore
    "EXECUTE ran" does not imply "VERIFY started".
  structural_causes:
    - id: A4
      what: sealed Write launcher is EXECUTE-only and exits after the write receipt (no AO follow-on)
      locators: ["HG-KSEOS/scripts/start-hgk-hermes.ps1:15-17", "HG-KSEOS/scripts/start-hgk-hermes.ps1:204-207", "HG-KSEOS/scripts/start-hgk-hermes.ps1:235-260", "HG-KSEOS/scripts/start-hgk-hermes.ps1:308-323", "HG-KSEOS/scripts/start-hgk-hermes.ps1:328-361"]
      confidence: HIGH
    - id: A5
