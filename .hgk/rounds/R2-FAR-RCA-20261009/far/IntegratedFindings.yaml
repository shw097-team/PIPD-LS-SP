# ---------------------------------------------------------------------------
# Deviation 2 — Q2: GPT-only PLANNING present only at delegate/FAR subagent layer
# ---------------------------------------------------------------------------
deviation_q2:
  statement: >
    Why was the PLANNING intelligence gpt-6.1-sol (openai-codex, OAuth, reasoning medium) only present
    at the delegate/FAR subagent layer, and not at the HGK lifecycle plan step nor the admission
    authoring layer (which ran on the deepseek main loop)?
  root_cause: >
    Three different things are all called "PLAN": the owner's PLANNING model policy, HGK's deterministic
    plan/admission state operation, and Hermes's actual authoring worker. The first two do not resolve a
    model policy, do not start GPT, and do not verify the content author; the Hermes main loop and
    ordinary delegation have their own model settings. GPT subagent execution therefore does not make a
    previously-conceived, main-loop-submitted admission become GPT-authored. The deterministic skeleton
    and orchestrator persistence are by design; what is missing is a verifiable GPT-author -> frozen
    admission handoff with an enforced entry point.
  supporting_claims:
    - id: B1
      status: CONFIRMED
      claim: plan() is not a GPT/DeepSeek planning call; it reads intent, calls _derive_tasks(goal, source_count) to build a fixed skeleton from keywords, then sets PLAN_READY.
      locators: ["HG-KSEOS/src/hg_kseos/lifecycle.py:260-292", "HG-KSEOS/src/hg_kseos/lifecycle.py:295-329"]
      observed: "The token_scan LLM hit is the line-296 docstring that NEGATES an external LLM; AST shows _derive_tasks calls only any, lower, append, insert. With 'research system acceptance' and source_count=2 it returns six fixed task families."
      confidence: HIGH
    - id: B2
      status: CONFIRMED
      claim: admit_requirement() and its register_requirement -> FROZEN -> create_taskspec -> create_workorder path make no model call and do not resolve a PLAN model policy; wording/objective are caller inputs.
      locators: ["HG-KSEOS/src/hg_kseos/lifecycle.py:555-609", "HG-KSEOS/src/hg_kseos/spine.py:151-322", "HG-KSEOS/src/hg_kseos/spine.py:53-89"]
      causal_effect: "If the main agent conceives the wording, oracle and tests and then calls the typed API, the author is still the main agent; the API does not start a GPT worker by step or actor name."
      confidence: HIGH
    - id: B3
      status: CONFIRMED
      claim: named_methods.route's provider means the METHOD supplier, not an LLM provider; it selects GSTACK/OPENSPEC/NATIVE, has no gpt-6.1-sol or deepseek field, and executes no model.
      locators: ["HG-KSEOS/src/hg_kseos/named_methods.py:151-192", "HG-KSEOS/AGENTS.md:28-32"]
      observed: "route('plan') returns GSTACK/gstack.plan-eng-review; route('admission') returns NATIVE/provider=null. Neither has a model field."
      confidence: HIGH
    - id: B4
      status: CONFIRMED
      claim: "Model choice is split by execution entry, not by one global PLAN route: ordinary delegate_task reads delegation settings or internal credentials_cfg; only the Kanban dispatcher converts card model_override/provider_override/reasoning_effort into worker argv. Neither can retroactively change an admission already authored in the main loop."
      locators: ["HG-KSEOS/Hermes/tools/delegate_tool.py:481-524", "HG-KSEOS/Hermes/tools/delegate_tool_config.py:416-435", "HG-KSEOS/Hermes/tools/delegate_tool_config.py:482-587", "HG-KSEOS/Hermes/hermes_cli/kanban_db_dispatch.py:2676-2707", "HG-KSEOS/Hermes/config.yaml:9-10,165-168"]
      observed: "main default=opencode-go/deepseek-v4.1-flash; delegation=openai-codex/gpt-6.1-sol; delegation.reasoning_effort unset, so child effort inherits the parent rather than auto-reading PLAN.medium."
      confidence: HIGH
    - id: B5
      status: CONFIRMED_WITH_SCOPE
      claim: PLAN is declared as an engine=hermes model lane, but in the checked lifecycle/admission chain it is not an automatic MODEL WORKER; lane_policy.route_for_lane only returns a dict; policy and probe tools are not dispatch wiring.
      locators: ["HG-KSEOS/config/model-lane-assignment.json:14-28,112-124", "HG-KSEOS/config/lane-routing-registry.yaml:32-42,51-70", "HG-KSEOS/src/hg_kseos/lane_policy.py:156-177", "HG-KSEOS/scripts/probe-hgk-lane.py:125-144"]
      qualification: "Registry marks CANDIDATE; activation needs a generation binding; PLAN.admission_status=UNPROVEN; the candidate probe's live dispatch is explicitly NOT_IMPLEMENTED."
      confidence: "HIGH (within checked scope)"
    - id: B6
      status: CAUSAL_RULING
      claim: The deterministic lifecycle and Hermes-as-orchestrator are existing design; claiming a main-agent-authored plan as satisfying GPT-only PLANNING is a policy-coverage/author-attribution gap, not a proven GPT provider fault.
      locators: ["HG-KSEOS/src/hg_kseos/lifecycle.py:7-14,260-273", "Fabric/AGENTS.md:23-27", "HG-KSEOS/config/model-lane-assignment.json:14-28,112-120"]
      confidence: HIGH
    - id: B7
      status: CONFIRMED
      claim: actor is a lease-validated STRING identity, not a model proof. The admission FROZEN event read uses actor=hermes-planner, payload_json={} with no model/provider/session field; embedding gpt-6.1-sol in the name cannot raise evidence strength.
      locators: ["HG-KSEOS/src/hg_kseos/spine.py:191-254", "HG-KSEOS/var/far-plan-enforcement-011/coordination/admission.json:56-70", "HG-KSEOS/src/hg_kseos/lane_admission.py:113-135", "HG-KSEOS/scripts/probe-hgk-lane.py:45-77"]
      confidence: HIGH
  PLAN_definition:
    as_declared: "PLAN is the model-route group for ARCH, HARD WORK, THREAT, EFFECT PLANNING, RESEARCH, SYNTHESIS, EVOLUTION; engine Hermes, openai-codex/gpt-6.1-sol, OpenAI OAuth, reasoning medium."
    as_implemented: "In this checked scope, PLAN is queryable/inspectable route DATA, not a worker auto-started by lifecycle.plan or the admission API. The real model worker is started by delegate_task settings or Kanban dispatcher card pins; if planning/admission content is generated in the main loop, the author model is whatever the main loop ran."
    governs_admission_authoring: "No enforced PLAN-author-model entry point was found in the checked admission path."
  alternatives_considered:
    - hypothesis: lifecycle.plan secretly calls DeepSeek
      ruling: "REFUTED: full function and AST call-site show no model call on this path."
    - hypothesis: named_methods.route('plan') provider decides the OpenAI model
      ruling: "REFUTED: it returns the gstack.plan-eng-review method route."
    - hypothesis: a PLAN card pin or gpt actor string auto-switches main-agent admission to GPT
      ruling: "REFUTED: card pins act only on dispatcher worker argv; actor is only an event/lease identity."
    - hypothesis: OAuth unavailable / GPT fallback made this round's admission deepseek-authored
      ruling: "ABSTAIN: no error, fallback or provider-transport evidence for the corresponding admission turn was obtained."
  residual_uncertainty:
    - "'This round's admission was deepseek-main-loop authored' is taken as a delegation input; the raw main-agent transcript for that turn was not obtained. effective_wiring is not a per-turn proof."
    - "Not proven that every GPT subagent actually ran at effort=medium; when delegation.reasoning_effort is unset it inherits the parent."
    - "Not exhaustive over all external wrappers / historical ExecutionBindings."
    - "A broad var-wide text scan timed out; the check was redone with named directories and file reads."

